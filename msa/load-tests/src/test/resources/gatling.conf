#########################
# Gatling Configuration #
#########################

gatling {
  core {
    outputDirectoryBaseName = "gatling"
    runDescription = "ThingsBoard Load Test"
    encoding = "utf-8"
    simulationClass = ""
    
    directory {
      results = target/gatling
      resources = src/test/resources
      binaries = target/test-classes
    }
  }
  
  charting {
    indicators {
      lowerBound = 100
      higherBound = 1000
      percentile1 = 50
      percentile2 = 75
      percentile3 = 95
      percentile4 = 99
    }
  }
  
  http {
    warmUpUrl = "http://localhost:8080/api/noauth/health"
    enableGA = false
    
    pooledConnectionIdleTimeout = 60000
    requestTimeout = 30000
    
    headers {
      accept = "application/json"
      acceptEncoding = "gzip, deflate"
      userAgent = "Gatling/ThingsBoard LoadTest"
    }
  }
  
  data {
    writers = [console, file]
    console {
      light = false
      writePeriod = 5
    }
    file {
      bufferSize = 8192
    }
  }
}
