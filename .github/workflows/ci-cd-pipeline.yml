name: ThingsBoard CI/CD Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  MAVEN_OPTS: "-Xmx4g"

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile and Build
        run: |
          echo "Building ThingsBoard application..."
          mvn clean install -DskipTests
          echo "Build completed successfully"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thingsboard-build
          path: |
            application/target/*.deb
            application/target/*.jar
          retention-days: 7

  test-and-quality:
    name: Tests and Code Quality
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Execute Unit Tests
        run: |
          echo "Running unit tests (excluding script-api module)..."
          mvn test -pl '!common/script/script-api'
          echo "Unit tests completed"

      - name: Run DeviceHealthStatus Tests
        run: |
          echo "Running DeviceHealthStatus feature tests..."
          mvn test -Dtest=DeviceHealthStatusTest -pl common/data
          echo "✅ All DeviceHealthStatus tests passed!"

      - name: Run Maven Checkstyle
        run: mvn checkstyle:check || true

      - name: Run SpotBugs
        run: mvn compile spotbugs:check || true

      - name: Generate Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: "**/target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/target/surefire-reports/"
          retention-days: 7

  load-tests:
    name: Performance Load Tests
    runs-on: ubuntu-latest
    needs: test-and-quality
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build load tests module
        run: mvn clean install -DskipTests -pl msa/load-tests -am

      - name: Start ThingsBoard test environment
        working-directory: msa/load-tests
        run: |
          echo "Starting Docker Compose stack for load testing..."
          docker compose -f docker-compose.loadtest.yml up -d
          echo "Waiting for ThingsBoard to be ready..."

      - name: Wait for ThingsBoard health check
        run: |
          timeout=180
          elapsed=0
          interval=10

          while [ $elapsed -lt $timeout ]; do
            if curl -f http://localhost:8080/api/noauth/health 2>/dev/null; then
              echo "✅ ThingsBoard is healthy and ready!"
              exit 0
            fi
            echo "Waiting for ThingsBoard... ($elapsed/$timeout seconds)"
            sleep $interval
            elapsed=$((elapsed + interval))
          done

          echo "❌ ThingsBoard failed to become healthy in time"
          docker compose -f msa/load-tests/docker-compose.loadtest.yml logs tb-core
          exit 1

      - name: Run Gatling load tests
        working-directory: msa/load-tests
        continue-on-error: true
        run: |
          echo "Running Gatling load tests..."
          mvn gatling:test -DloadTests.skip=false
          echo "Load tests completed"

      - name: Generate test summary
        if: always()
        working-directory: msa/load-tests
        run: |
          if [ -f src/test/resources/gatling-results-to-markdown.sh ]; then
            chmod +x src/test/resources/gatling-results-to-markdown.sh
            ./src/test/resources/gatling-results-to-markdown.sh >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Gatling reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-load-test-reports
          path: msa/load-tests/target/gatling/
          retention-days: 30

      - name: Stop ThingsBoard test environment
        if: always()
        working-directory: msa/load-tests
        run: |
          echo "Stopping Docker Compose stack..."
          docker compose -f docker-compose.loadtest.yml logs tb-core
          docker compose -f docker-compose.loadtest.yml down -v

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, test-and-quality, load-tests]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: thingsboard-build
          path: ./artifacts

      - name: Get version from pom.xml
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release Tag
        id: create_tag
        run: |
          TAG_NAME="v${{ steps.version.outputs.version }}-build.${{ github.run_number }}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a $TAG_NAME -m "Release $TAG_NAME"
          git push origin $TAG_NAME || echo "Tag already exists"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.create_tag.outputs.tag_name }}
          name: ThingsBoard Release ${{ steps.version.outputs.version }}
          body: |
            ## ThingsBoard Release ${{ steps.version.outputs.version }}

            ### Changes
            - Build from commit: ${{ github.sha }}
            - Build number: ${{ github.run_number }}

            ### Artifacts
            This release includes the compiled ThingsBoard application packages.

            ### Installation
            See the [official documentation](https://thingsboard.io/docs/user-guide/install/installation-options/) for installation instructions.
          files: |
            ./artifacts/*.deb
            ./artifacts/*.jar
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'SNAPSHOT') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notification:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [release]
    if: always()

    steps:
      - name: Notify on Success
        if: ${{ needs.release.result == 'success' }}
        run: |
          echo "✅ Pipeline completed successfully!"
          echo "Release created successfully."
          echo "Load tests completed - check artifacts for performance reports."

      - name: Notify on Failure
        if: ${{ needs.release.result == 'failure' }}
        run: |
          echo "❌ Pipeline failed!"
          echo "Please check the logs for details."
